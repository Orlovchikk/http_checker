---
dependency:
  name: galaxy
  requirements-file: ../../requirements.yml

driver:
  name: vagrant
  provider:
    name: virtualbox
    options:
      memory: 1024
      cpus: 1

platforms:
  - name: test-debian-docker
    box: generic/debian12
  - name: test-ubuntu-docker
    box: ubuntu/jammy64

provisioner:
  name: ansible
  log: True
  env:
    ANSIBLE_ROLES_PATH: ../../roles

verifier:
  name: ansible
