---
- name: Установка зависимостей
  ansible.builtin.apt:
    name: "{{ docker_required_packages }}"
    state: present
    update_cache: yes

- name: Создание директории для ключей apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Скачивание GPG ключа Docker
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    force: yes

- name: Добавление репозитория Docker
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
    state: present
    filename: docker
    update_cache: yes

- name: Установка пакетов Docker
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: yes

- name: Запуск Docker и добавление его в автозагрузку
  ansible.builtin.service:
    name: docker
    state: started
    enabled: "{{ is_enabled_docker_autostart | default(true) | bool }}"

- name: Добавление пользователя в группу Docker
  ansible.builtin.user:
    name: "{{ docker_admin_user }}"
    groups: docker
    append: yes
  when: docker_admin_user is defined
